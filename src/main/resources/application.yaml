server:
  port: 8081

spring:
  application:
    name: suitcase-booking
  boot:
    admin:
      client:
        url: http://bikeboxgo.ru:8085  # Адрес сервера SBA
        instance:
          name: suitcase-booking  # Уникальное имя для каждого сервиса!
  datasource:
    url: jdbc:postgresql://103.74.93.74:5432/postgres
    username: admin
    password: lPFMUWrH
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: HikariPoolSuitcase


  rabbitmq:
    host: 103.74.93.74
    port: 5672
    username: admin
    password: HyEaPMAr
    virtual-host: /app

  jpa:
    hibernate:
      ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env, loggers
  endpoint:
    health:
      show-details: always

